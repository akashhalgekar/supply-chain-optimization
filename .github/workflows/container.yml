name: container

# Builds the exact image Hugging Face runs and checks the site answers, so a broken deploy shows up on the PR first.

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t tidewell .
      - name: Start it and check the dashboard and the analyst's tools
        run: |
          docker run -d --name tw -p 7860:7860 tidewell
          for i in $(seq 1 60); do curl -sf localhost:7860/api/defaults >/dev/null && break; sleep 2; done
          curl -sf localhost:7860/ | grep -q "Tidewell"
          curl -sf -X POST localhost:7860/api/run -H 'content-type: application/json' -d '{}' | python -c "import sys,json; d=json.load(sys.stdin); assert d['feasible'], d; print('weekly cost', round(d['kpi']['weekly_cost']))"
          curl -sf localhost:7860/api/advisor | python -c "import sys,json; d=json.load(sys.stdin); assert len(d['tools']) == 4, d.keys(); print('analyst tools:', [t['name'] for t in d['tools']])"
          curl -sf -X POST localhost:7860/api/advisor/tool -H 'content-type: application/json' -d '{"name":"safety_stock","input":{"average_demand_per_period":400,"demand_std_dev_per_period":120,"lead_time_periods":2}}' | python -c "import sys,json; d=json.load(sys.stdin); assert not d['is_error'], d; print('safety stock tool OK')"
          echo "Container serves the dashboard and the analyst's tools, with no API key inside."
      - name: Browser check of the AI analyst (Anthropic API mocked, no key)
        run: |
          pip install -q playwright==1.56.0
          python -m playwright install --with-deps chromium
          BASE=http://localhost:7860/ python web/browser_check.py
      - name: Logs on failure
        if: failure()
        run: docker logs tw || true
